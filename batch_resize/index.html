<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNG 批量多分辨率导出</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>PNG 批量分辨率导出</h1>
      <p>上传一张 PNG，批量导出为多种尺寸与格式（PNG / ICO / ICNS）。</p>
    </header>

    <main>
      <section class="panel">
        <div class="row">
          <label class="file">
            <input id="fileInput" type="file" accept="image/png" />
            <span>选择 PNG 文件…</span>
          </label>
          <div id="fileInfo" class="muted"></div>
        </div>

        <div class="row options">
          <div class="group">
            <div class="group-title">缩放模式</div>
            <label><input type="radio" name="mode" value="width" checked /> 按宽度适配</label>
            <label><input type="radio" name="mode" value="height" /> 按高度适配</label>
            <label title="不拉伸，保持比例，透明填充到指定画布"><input type="radio" name="mode" value="contain" /> 画布固定（等比居中，透明填充）</label>
          </div>

          <div class="group">
            <div class="group-title">导出格式</div>
            <label><input type="checkbox" id="exportPng" checked /> PNG</label>
            <label><input type="checkbox" id="exportIco" checked /> ICO</label>
            <label><input type="checkbox" id="exportIcns" checked /> ICNS</label>
          </div>
        </div>

        <div class="row">
          <details open>
            <summary>默认尺寸（可勾选）</summary>
            <div id="presetContainer" class="grid"></div>
          </details>
        </div>

        <div class="row">
          <details>
            <summary>添加自定义尺寸</summary>
            <div class="custom">
              <input id="customName" placeholder="文件名，如 200x120.png" />
              <input id="customW" type="number" placeholder="宽度" min="1" />
              <input id="customH" type="number" placeholder="高度" min="1" />
              <button id="addCustom">添加</button>
            </div>
          </details>
        </div>

        <div class="row actions">
          <button id="generateBtn" disabled>生成并下载</button>
          <button id="previewBtn" disabled>快速预览</button>
          <div id="status" class="muted"></div>
        </div>
      </section>

      <section id="preview" class="panel" hidden>
        <h2>预览</h2>
        <div id="previewList" class="preview-grid"></div>
      </section>
    </main>

    <footer>
      <small>所有处理均在本地浏览器完成，无需上传文件。</small>
    </footer>

    <script src="app.js"></script>
  </body>
  </html>
