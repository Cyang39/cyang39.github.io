<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>布匹色卡排版 & 导出 PNG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --cols: 4;
      --gap: 16px;
      --diameter: 120px;
      --bg: #f7f7f9;
      --panel: #ffffff;
      --border: #e6e6eb;
      --text: #1f2328;
      --muted: #6a6f76;
      --accent: #007aff;
      --radius: 16px;
      --shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f9fafb, #f3f4f7);
    }
    .app{
      display:flex;
      gap: 16px;
      height: 100%;
      padding: 16px;
    }
    .panel{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display:flex;
      flex-direction: column;
      min-height: 0;
    }
    .left{ flex: 2 1 66%; padding: 16px; }
    .right{ flex: 1 1 34%; padding: 12px; }

    .toolbar{
      display:flex;
      align-items:center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar h2{ font-size:16px; margin:0; margin-right:auto; font-weight:600; }
    .field{
      display:flex; align-items:center; gap:8px;
      background:#fafafb; border:1px solid var(--border);
      padding:6px 10px; border-radius:10px;
    }
    .field label{ color: var(--muted); white-space:nowrap; }
    .field input[type="number"]{
      width: 72px; padding:6px 8px; border:1px solid var(--border);
      border-radius:8px; outline:none; background:white;
    }
    .field input[type="text"]{
      width: 80px; padding:6px 8px; border:1px solid var(--border);
      border-radius:8px; outline:none; background:white;
    }
    .grid{
      --_cols: var(--cols);
      display:grid;
      grid-template-columns: repeat(var(--_cols), minmax(0, 1fr));
      gap: var(--gap);
      padding: 4px;
      overflow:auto;
    }
    .swatch{
      display:flex; flex-direction:column; align-items:center; gap:10px;
      padding:10px 6px 14px; background:#fff; border:1px dashed #e9e9ef; border-radius: 14px;
    }
    .circle{
      width: var(--diameter); height: var(--diameter); border-radius: 50%;
      background-color: #ddd; background-size: cover; background-position: center;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 1px 6px rgba(0,0,0,.05);
    }
    .label{ font-weight:600; letter-spacing:.5px; font-feature-settings: "tnum"; color:#2b2f36; user-select:text; }
    .hint{ color: var(--muted); font-size: 12px; }
    .pasteZone{
      display:flex; align-items:center; justify-content:center; text-align:center;
      min-height: 120px; border: 2px dashed var(--border); border-radius: 12px;
      padding: 14px; background: #fbfbfd; transition: .2s ease border-color, .2s ease background; margin-bottom: 12px;
    }
    .pasteZone.dragover{ border-color: var(--accent); background: #f0f7ff; }
    .pasteZone b{ color: var(--accent); }
    .thumbList{
      overflow:auto; padding: 6px; display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    }
    .thumb{
      display:flex; gap:8px; align-items:center; background:#fff;
      border:1px solid var(--border); border-radius: 12px; padding:8px; box-shadow: var(--shadow);
    }
    .thumb[aria-grabbed="true"]{ opacity:.6; outline: 2px dashed var(--accent); }
    .thumb .preview{
      width:72px; height:72px; border-radius: 10px; background-size: cover; background-position: center; border:1px solid rgba(0,0,0,.06); flex-shrink:0;
    }
    .thumb .meta{ display:flex; flex-direction:column; gap:6px; min-width:0; flex:1; }
    .meta .name{ font-size:12px; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 160px; }
    .controls{ display:flex; gap:6px; }
    button, .btn{
      appearance: none; border:1px solid var(--border); background:#fff;
      padding:6px 10px; border-radius:10px; cursor:pointer; font-size:12px;
      transition:.15s ease background, .15s ease transform, .15s ease border-color;
    }
    button:hover{ background:#f5f7fb; }
    .btn-danger{ border-color:#f0d5d5; color:#b30021; background:#fff7f8; }
    .btn-primary{ border-color:#cfe2ff; color:#0b5ed7; background:#eef6ff; }
    .dragHandle{ cursor:grab; user-select:none; font-size:16px; line-height:1; padding: 4px 8px; border-radius: 8px; border:1px solid var(--border); background:#fafbff; }
    .footerNote{ margin-top:8px; color:var(--muted); font-size:12px; text-align:center; }

    /* Print: 仅打印左侧色卡 */
    @media print {
      body{ background:#fff; }
      .app{ padding:0; }
      .right, .toolbar { display:none !important; }
      .left{ border:none; box-shadow:none; padding:0; margin:0; }
      .grid{ gap: 12px; padding:0; }
      .swatch{ border:1px solid #eee; box-shadow:none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左侧：色卡排版 -->
    <section class="panel left" aria-label="色卡排版">
      <div class="toolbar">
        <h2>色卡排版</h2>
        <div class="field">
          <label for="cols">每行数量</label>
          <input id="cols" type="number" min="1" max="12" step="1" value="4" />
        </div>
        <div class="field">
          <label for="diameter">色卡直径</label>
          <input id="diameter" type="number" min="60" max="220" step="10" value="120" />
        </div>
        <div class="field">
          <label for="gap">间距</label>
          <input id="gap" type="number" min="0" max="48" step="2" value="16" />
        </div>
      </div>

      <!-- 导出设置 -->
      <div class="toolbar" style="margin-top:-4px;">
        <h2>导出设置</h2>
        <div class="field">
          <label for="margin">边距(px)</label>
          <input id="margin" type="number" min="0" max="200" step="2" value="32" />
        </div>
        <div class="field">
          <label for="scale">缩放(倍)</label>
          <input id="scale" type="number" min="1" max="4" step="1" value="2" />
        </div>
        <div class="field">
          <label for="labelSize">字号(px)</label>
          <input id="labelSize" type="number" min="10" max="36" step="1" value="14" />
        </div>
        <div class="field">
          <label for="startNo">起始编号</label>
          <input id="startNo" type="number" min="0" max="9999" step="1" value="1" />
        </div>
        <div class="field">
          <label for="padLen">位数</label>
          <input id="padLen" type="number" min="1" max="4" step="1" value="2" />
        </div>
        <div class="field">
          <label for="prefix">前缀</label>
          <input id="prefix" type="text" value="No." />
        </div>
        <div class="field">
          <label for="bgColor">背景</label>
          <input id="bgColor" type="color" value="#ffffff" />
        </div>
        <button id="exportBtn" class="btn btn-primary">导出 PNG</button>
      </div>

      <div id="grid" class="grid" role="list" aria-live="polite" aria-label="色卡网格"></div>

      <div class="footerNote">提示：按 <kbd>⌘/Ctrl + V</kbd> 在右侧粘贴图片；拖动右侧缩略图改变顺序，左侧将实时更新；点击「导出 PNG」输出高分辨率图片。</div>
    </section>

    <!-- 右侧：粘贴区 + 缩略图列表 -->
    <aside class="panel right" aria-label="图片输入与排序">
      <div id="pasteZone" class="pasteZone" tabindex="0" aria-label="粘贴与拖放区域">
        <div>
          <div style="font-weight:600; margin-bottom:6px;">在此 <b>粘贴</b> 或 <b>拖放</b> 布料截图</div>
          <div class="hint">也可点击上传</div>
          <div style="margin-top:8px;">
            <button id="pickBtn" class="btn">选择图片</button>
            <input id="fileInput" type="file" accept="image/*" multiple hidden />
          </div>
        </div>
      </div>

      <div class="toolbar" style="margin:0 6px 8px;">
        <h2 style="font-size:14px;">图片序列（可拖动排序）</h2>
        <button id="clearBtn" class="btn btn-danger" title="清空所有图片">清空</button>
      </div>

      <div id="thumbList" class="thumbList" aria-label="缩略图列表"></div>
    </aside>
  </div>

  <script>
    (() => {
      // 状态
      const state = { items: [] }; // { id, url, name }

      // DOM
      const gridEl = document.getElementById('grid');
      const thumbListEl = document.getElementById('thumbList');
      const pasteZoneEl = document.getElementById('pasteZone');
      const fileInputEl = document.getElementById('fileInput');
      const pickBtn = document.getElementById('pickBtn');
      const clearBtn = document.getElementById('clearBtn');
      const exportBtn = document.getElementById('exportBtn');

      // 预览控制
      const colsInput = document.getElementById('cols');
      const diameterInput = document.getElementById('diameter');
      const gapInput = document.getElementById('gap');

      // 导出控制
      const marginInput = document.getElementById('margin');
      const scaleInput = document.getElementById('scale');
      const labelSizeInput = document.getElementById('labelSize');
      const startNoInput = document.getElementById('startNo');
      const padLenInput = document.getElementById('padLen');
      const prefixInput = document.getElementById('prefix');
      const bgColorInput = document.getElementById('bgColor');

      // 工具
      const pad = (n, len=2) => String(n).padStart(len, '0');
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function setCSSVars(){
        document.documentElement.style.setProperty('--cols', clamp(+colsInput.value||4, 1, 12));
        document.documentElement.style.setProperty('--diameter', clamp(+diameterInput.value||120, 60, 220) + 'px');
        document.documentElement.style.setProperty('--gap', clamp(+gapInput.value||16, 0, 48) + 'px');
      }

      function renderGrid(){
        gridEl.innerHTML = '';
        state.items.forEach((it, idx) => {
          const card = document.createElement('div');
          card.className = 'swatch';
          card.setAttribute('role', 'listitem');

          const circle = document.createElement('div');
          circle.className = 'circle';
          circle.style.backgroundImage = `url("${it.url}")`;
          circle.setAttribute('aria-label', `色卡 ${idx+1}`);

          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = `${prefixInput.value.trim()} ${pad(+startNoInput.value + idx, +padLenInput.value)}`;

          card.appendChild(circle);
          card.appendChild(label);
          gridEl.appendChild(card);
        });
      }

      function renderThumbs(){
        thumbListEl.innerHTML = '';
        state.items.forEach((it, idx) => {
          const li = document.createElement('div');
          li.className = 'thumb';
          li.draggable = true;
          li.dataset.index = idx;
          li.setAttribute('aria-grabbed', 'false');

          const preview = document.createElement('div');
          preview.className = 'preview';
          preview.style.backgroundImage = `url("${it.url}")`;
          preview.title = it.name || `Image ${idx+1}`;

          const meta = document.createElement('div');
          meta.className = 'meta';

          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = it.name || `图片 ${idx+1}`;

          const controls = document.createElement('div');
          controls.className = 'controls';

          const handle = document.createElement('span');
          handle.className = 'dragHandle';
          handle.title = '拖动以排序';
          handle.textContent = '≡';

          const del = document.createElement('button');
          del.className = 'btn btn-danger';
          del.textContent = '删除';
          del.addEventListener('click', () => removeIndex(idx));

          controls.appendChild(handle);
          controls.appendChild(del);

          meta.appendChild(name);
          meta.appendChild(controls);

          li.appendChild(preview);
          li.appendChild(meta);

          // DnD
          li.addEventListener('dragstart', (e) => {
            li.setAttribute('aria-grabbed', 'true');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(idx));
          });
          li.addEventListener('dragend', () => {
            li.setAttribute('aria-grabbed', 'false');
          });
          li.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
          });
          li.addEventListener('drop', (e) => {
            e.preventDefault();
            const from = Number(e.dataTransfer.getData('text/plain'));
            const to = Number(li.dataset.index);
            if (!Number.isNaN(from) && !Number.isNaN(to) && from !== to) {
              moveItem(from, to);
            }
          });

          thumbListEl.appendChild(li);
        });
      }

      function moveItem(from, to){
        const arr = state.items;
        const item = arr.splice(from, 1)[0];
        arr.splice(to, 0, item);
        renderGrid(); renderThumbs();
      }

      function removeIndex(i){
        const [removed] = state.items.splice(i, 1);
        try { if (removed && removed.url && removed.url.startsWith('blob:')) URL.revokeObjectURL(removed.url); } catch {}
        renderGrid(); renderThumbs();
      }

      function clearAll(){
        state.items.forEach(it => {
          try { if (it.url && it.url.startsWith('blob:')) URL.revokeObjectURL(it.url); } catch {}
        });
        state.items = [];
        renderGrid(); renderThumbs();
      }

      // 添加文件/粘贴
      async function addFiles(files){
        const list = Array.from(files).filter(f => f.type && f.type.startsWith('image/'));
        for (const file of list){
          const url = URL.createObjectURL(file);
          state.items.push({ id: Date.now() + Math.random(), url, name: file.name });
        }
        renderGrid(); renderThumbs();
      }

      // 粘贴
      function onPaste(e){
        const items = (e.clipboardData && e.clipboardData.items) ? Array.from(e.clipboardData.items) : [];
        const imgs = items.filter(it => it.type && it.type.startsWith('image/'));
        if (imgs.length === 0) return;
        e.preventDefault();
        const files = imgs.map(it => it.getAsFile()).filter(Boolean);
        addFiles(files);
      }

      // ===== 导出：将当前序列绘制成 Canvas 并下载 =====
      async function exportPNG(){
        if (state.items.length === 0){
          alert('请先在右侧粘贴或添加图片。');
          return;
        }
        exportBtn.disabled = true; exportBtn.textContent = '导出中…';

        // 读取当前设置
        const cols = clamp(+colsInput.value||4, 1, 12);
        const diameter = clamp(+diameterInput.value||120, 60, 220);
        const gap = clamp(+gapInput.value||16, 0, 64);
        const margin = clamp(+marginInput.value||32, 0, 200);
        const scale = clamp(+scaleInput.value||2, 1, 4);
        const labelSize = clamp(+labelSizeInput.value||14, 10, 36);
        const startNo = Math.max(0, +startNoInput.value||1);
        const padLen = clamp(+padLenInput.value||2, 1, 4);
        const prefix = prefixInput.value.trim() || 'No.';
        const bgColor = bgColorInput.value || '#ffffff';

        const n = state.items.length;
        const rows = Math.ceil(n / cols);
        const radius = diameter / 2;

        // 计算画布尺寸
        const labelHeight = labelSize + 10; // 文本高度 + 间距
        const width = margin*2 + cols*diameter + (cols-1)*gap;
        const height = margin*2 + rows*(diameter + labelHeight) + (rows-1)*gap;

        // 创建画布（支持缩放以提升清晰度）
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.floor(width * scale));
        canvas.height = Math.max(1, Math.floor(height * scale));
        const ctx = canvas.getContext('2d');

        // 背景
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 文本设置
        ctx.fillStyle = '#2b2f36';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.font = `600 ${labelSize*scale}px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans", sans-serif`;

        // 预加载图片
        const images = await Promise.all(state.items.map(loadImageSafe));

        // 绘制
        for (let i=0; i<n; i++){
          const row = Math.floor(i / cols);
          const col = i % cols;

          // 位置（未缩放）
          const x = margin + col*(diameter + gap);
          const y = margin + row*(diameter + labelHeight + gap);

          // 放大后的位置与尺寸
          const dx = Math.round(x * scale);
          const dy = Math.round(y * scale);
          const d = Math.round(diameter * scale);
          const r = d/2;

          // 圆形裁剪并绘制图片（等比覆盖）
          ctx.save();
          ctx.beginPath();
          ctx.arc(dx + r, dy + r, r, 0, Math.PI*2);
          ctx.clip();

          const img = images[i];
          if (img){
            // 以图片中心裁剪为正方形，实现 "cover"
            const sw = Math.min(img.width, img.height);
            const sx = Math.floor((img.width - sw) / 2);
            const sy = Math.floor((img.height - sw) / 2);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, sx, sy, sw, sw, dx, dy, d, d);
          }else{
            // 加载失败时填充灰色
            ctx.fillStyle = '#ddd';
            ctx.fillRect(dx, dy, d, d);
          }
          ctx.restore();

          // 外边框（细）
          ctx.beginPath();
          ctx.arc(dx + r, dy + r, r - 0.5, 0, Math.PI*2);
          ctx.strokeStyle = 'rgba(0,0,0,0.08)';
          ctx.lineWidth = Math.max(1, scale); // 随缩放调整
          ctx.stroke();

          // 文本
          const label = `${prefix} ${String(startNo + i).padStart(padLen, '0')}`;
          const tx = dx + r;
          const ty = dy + d + Math.round(labelSize * scale) + Math.round(6 * scale);
          ctx.fillStyle = '#2b2f36';
          ctx.fillText(label, tx, ty);
        }

        // 生成文件名
        const ts = new Date();
        const name = `swatches-${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}-${pad(ts.getHours())}${pad(ts.getMinutes())}${pad(ts.getSeconds())}.png`;

        // 触发下载
        canvas.toBlob((blob) => {
          if (!blob) { alert('导出失败：生成图像数据为空'); resetBtn(); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          resetBtn();
        }, 'image/png');

        function resetBtn(){
          exportBtn.disabled = false;
          exportBtn.textContent = '导出 PNG';
        }
      }

      // 加载图片（从 blob: URL）
      async function loadImageSafe(item){
        try{
          const img = new Image();
          // blob: 同源，不需要跨域；若未来支持远程URL可开启：
          // img.crossOrigin = 'anonymous';
          img.src = item.url;
          if (img.decode) { await img.decode(); }
          else { await new Promise((res, rej)=>{ img.onload=res; img.onerror=rej; }); }
          return img;
        }catch(e){
          console.warn('图片加载失败', item?.name || item?.url, e);
          return null;
        }
      }

      // 事件绑定
      pasteZoneEl.addEventListener('dragover', (e) => { e.preventDefault(); pasteZoneEl.classList.add('dragover'); });
      pasteZoneEl.addEventListener('dragleave', () => pasteZoneEl.classList.remove('dragover'));
      pasteZoneEl.addEventListener('drop', (e) => {
        e.preventDefault(); pasteZoneEl.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
      });
      pickBtn.addEventListener('click', () => fileInputEl.click());
      fileInputEl.addEventListener('change', (e) => { addFiles(e.target.files || []); fileInputEl.value = ''; });
      pasteZoneEl.addEventListener('paste', onPaste);
      window.addEventListener('paste', (e) => {
        const active = document.activeElement;
        const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
        if (isInput && active !== pasteZoneEl) return;
        onPaste(e);
      });
      clearBtn.addEventListener('click', clearAll);
      exportBtn.addEventListener('click', exportPNG);

      // 控件变化 -> 预览刷新
      [colsInput, diameterInput, gapInput, startNoInput, padLenInput, prefixInput].forEach(el => {
        el.addEventListener('input', () => { setCSSVars(); renderGrid(); });
        el.addEventListener('change', () => { setCSSVars(); renderGrid(); });
      });

      // 初始化
      setCSSVars(); renderGrid(); renderThumbs();

      // 清理：离开页面时释放 blob 对象
      window.addEventListener('beforeunload', () => {
        state.items.forEach(it => { try{ if (it.url?.startsWith('blob:')) URL.revokeObjectURL(it.url); }catch{} });
      });
    })();
  </script>
</body>
</html>
