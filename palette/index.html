/* ============== 颜色计算与渲染 ============== */
const toHex2 = (v)=> v.toString(16).padStart(2,"0");
const rgbToHex = ([r,g,b])=> "#" + toHex2(r) + toHex2(g) + toHex2(b);
const hexCss = (rgb)=> `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
const clamp = (x,a,b)=> Math.max(a, Math.min(b, x));
const euclid2 = (a,b)=>{ const dr=a[0]-b[0], dg=a[1]-b[1], db=a[2]-b[2]; return dr*dr+dg*dg+db*db; };
const randInt = (n)=> Math.floor(Math.random()*n);

function kmeansPlusPlusInit(points, k){
  const centroids=[ points[randInt(points.length)] ];
  while(centroids.length<k){
    const d2 = points.map(p=>{ let m=Infinity; for(const c of centroids){ const d=euclid2(p,c); if(d<m)m=d; } return m; });
    const sum = d2.reduce((a,b)=>a+b,0);
    let r=Math.random()*sum; let chosen=null;
    for(let i=0;i<points.length;i++){ r-=d2[i]; if(r<=0){ chosen=points[i]; break; } }
    centroids.push(chosen || points[randInt(points.length)]);
  }
  return centroids.map(c=>[...c]);
}
function kmeans(points, k, maxIter=20){
  if(points.length<k) k = points.length;
  let centroids = kmeansPlusPlusInit(points, k);
  let labels = new Array(points.length).fill(0);
  for(let iter=0; iter<maxIter; iter++){
    let changed=false;
    for(let i=0;i<points.length;i++){
      let best=0, bd=Infinity, p=points[i];
      for(let c=0;c<centroids.length;c++){ const d=euclid2(p,centroids[c]); if(d<bd){ bd=d; best=c; } }
      if(labels[i]!==best){ labels[i]=best; changed=true; }
    }
    if(!changed && iter>0) break;
    const sum=centroids.map(()=>[0,0,0]); const cnt=centroids.map(()=>0);
    for(let i=0;i<points.length;i++){
      const c=labels[i];
      sum[c][0]+=points[i][0]; sum[c][1]+=points[i][1]; sum[c][2]+=points[i][2]; cnt[c]++;
    }
    for(let c=0;c<centroids.length;c++){
      if(cnt[c]>0){
        centroids[c][0]=Math.round(sum[c][0]/cnt[c]);
        centroids[c][1]=Math.round(sum[c][1]/cnt[c]);
        centroids[c][2]=Math.round(sum[c][2]/cnt[c]);
      }else{
        centroids[c]=points[randInt(points.length)];
      }
    }
  }
  return { centroids, labels };
}
function mergeSmallClusters(result, points, minPct){
  const { centroids, labels } = result;
  const n=points.length;
  const counts = centroids.map(()=>0);
  for(const lab of labels) counts[lab]++;
  const big = new Set();
  for(let c=0;c<centroids.length;c++){ if(counts[c]/n >= minPct) big.add(c); }
  if(big.size===centroids.length) return { centroids, labels };
  const newLabels = labels.slice();
  for(let i=0;i<points.length;i++){
    const lab=labels[i];
    if(!big.has(lab)){
      let best=null, bd=Infinity;
      for(const c of big){ const d=euclid2(points[i],centroids[c]); if(d<bd){ bd=d; best=c; } }
      if(best!==null) newLabels[i]=best;
    }
  }
  const bigList=[...big];
  const idxMap=new Map(bigList.map((c,idx)=>[c,idx]));
  const newC=bigList.map(()=>[0,0,0]); const newCnt=bigList.map(()=>0);
  for(let i=0;i<points.length;i++){
    const lab=newLabels[i]; const j=idxMap.get(lab);
    newC[j][0]+=points[i][0]; newC[j][1]+=points[i][1]; newC[j][2]+=points[i][2]; newCnt[j]++;
  }
  for(let j=0;j<newC.length;j++){
    if(newCnt[j]>0){
      newC[j][0]=Math.round(newC[j][0]/newCnt[j]);
      newC[j][1]=Math.round(newC[j][1]/newCnt[j]);
      newC[j][2]=Math.round(newC[j][2]/newCnt[j]);
    }
  }
  return { centroids:newC, labels:newLabels };
}
async function getPixelsFromFile(file){
  const blobURL = URL.createObjectURL(file);
  const img = new Image();
  img.src = blobURL;
  await img.decode();
  document.getElementById("original").src = blobURL; // 预览

  const maxSide = 300;
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.floor(img.naturalWidth * scale));
  const h = Math.max(1, Math.floor(img.naturalHeight * scale));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(blobURL);

  const { data } = ctx.getImageData(0,0,w,h);
  const target = 50000;
  const step = Math.max(1, Math.floor(Math.sqrt((w*h)/target)));
  const pts = [];
  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      const off=(y*w + x)*4;
      const r=data[off], g=data[off+1], b=data[off+2], a=data[off+3];
      if(a===0) continue;
      pts.push([r,g,b]);
    }
  }
  return pts;
}
function drawBands(canvas, colors, size, orientation="vertical"){
  const width=size, height=size;
  canvas.width=width; canvas.height=height;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,width,height);
  if(!colors.length) return;
  if(orientation==="vertical"){
    const raw = colors.map(c=>c.pct*width);
    const flo = raw.map(Math.floor);
    let used=flo.reduce((a,b)=>a+b,0), remain = width - used;
    const order = raw.map((v,i)=>({i, f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f).map(o=>o.i);
    const bandW = flo.slice(); for(let t=0;t<remain;t++) bandW[order[t]]++;
    let x=0; colors.forEach((c,i)=>{ const w=bandW[i]; ctx.fillStyle=hexCss(c.rgb); ctx.fillRect(x,0,w,height); x+=w; });
  }else{
    const raw = colors.map(c=>c.pct*height);
    const flo = raw.map(Math.floor);
    let used=flo.reduce((a,b)=>a+b,0), remain = height - used;
    const order = raw.map((v,i)=>({i, f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f).map(o=>o.i);
    const bandH = flo.slice(); for(let t=0;t<remain;t++) bandH[order[t]]++;
    let y=0; colors.forEach((c,i)=>{ const h=bandH[i]; ctx.fillStyle=hexCss(c.rgb); ctx.fillRect(0,y,width,h); y+=h; });
  }
}

/* ======== State & UI wiring ======== */
const els = {
  drop: document.getElementById("dropArea"),
  file: document.getElementById("file"),
  k: document.getElementById("k"),
  minPct: document.getElementById("minPct"),
  minPctR: document.getElementById("minPctRange"),
  maxIter: document.getElementById("maxIter"),
  orientRadios: document.querySelectorAll("input[name='orient']"),
  outSize: document.getElementById("outSize"),
  outSizeR: document.getElementById("outSizeRange"),
  paletteList: document.getElementById("paletteList"),
  preview: document.getElementById("preview"),
  distText: document.getElementById("distText"),
  download: document.getElementById("download"),
  original: document.getElementById("original"),
};
let paletteAll = []; // [{rgb, hex, pct, enabled}]

function syncPair(a,b, min, max){
  const sync = (src, dst) => { dst.value = clamp(parseFloat(src.value || "0"), min, max); renderPreview(); };
  a.addEventListener("input", ()=>sync(a,b,min,max));
  b.addEventListener("input", ()=>sync(b,a,min,max));
}
syncPair(els.minPctR, els.minPct, 0, 0.2);
// 单一尺寸滑块（正方形）
(function(){
  const range = document.getElementById("outSizeRange");
  const num   = document.getElementById("outSize");
  const apply = ()=>{ num.value = range.value; renderPreview(); };
  const applyNum = ()=>{ range.value = clamp(parseInt(num.value||"100",10), 32, 2000); renderPreview(); };
  range.addEventListener("input", apply);
  num.addEventListener("input", applyNum);
})();
function getOrientation(){ return Array.from(els.orientRadios).find(r=>r.checked)?.value || "vertical"; }

function renderPaletteList(){
  const list = els.paletteList;
  list.innerHTML = "";
  if(!paletteAll.length){
    list.textContent = I18N[lang].noColors;
    return;
  }
  paletteAll.forEach((c, idx)=>{
    const line = document.createElement("div");
    line.className = "color-item";
    line.innerHTML = `
      <input type="checkbox" data-i="${idx}" ${c.enabled ? "checked": ""} aria-label="toggle color"/>
      <div class="swatch" style="background:${hexCss(c.rgb)}"></div>
      <div><strong>${c.hex}</strong> <span class="muted"> ${(c.pct*100).toFixed(2)}%</span></div>
      <button class="btn" data-copy="${c.hex}" title="Copy HEX">HEX</button>
    `;
    list.appendChild(line);
  });
  list.querySelectorAll("input[type='checkbox']").forEach(chk=>{
    chk.addEventListener("change", (e)=>{
      const i = parseInt(e.target.getAttribute("data-i"),10);
      paletteAll[i].enabled = e.target.checked;
      renderPreview();
    });
  });
  list.querySelectorAll("button[data-copy]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const hex = btn.getAttribute("data-copy");
      try { await navigator.clipboard.writeText(hex); btn.textContent="✓"; setTimeout(()=>btn.textContent="HEX",800); } catch {}
    });
  });
}
function normalizedSelected(){
  const sel = paletteAll.filter(c=>c.enabled);
  const sum = sel.reduce((a,b)=>a+b.pct, 0);
  if(sum<=0) return [];
  return sel.map(c=>({ ...c, pct: c.pct / sum }));
}
function renderPreview(){
  const size = clamp(parseInt(document.getElementById("outSize").value || "100",10), 32, 2000);
  const orient = getOrientation();
  const colors = normalizedSelected();
  drawBands(els.preview, colors, size, orient);
  els.download.disabled = colors.length===0;
  els.distText.textContent = colors.length
    ? colors.map(c=>`${c.hex} ${(c.pct*100).toFixed(2)}%`).join(" · ")
    : I18N[lang].noneSelected;
}

/* Auto analyze on file set or drop */
async function analyzeFromFile(file){
  try{
    const points = await getPixelsFromFile(file);
    const k = clamp(parseInt(els.k.value || "5",10), 2, 12);
    const minPct = clamp(parseFloat(els.minPct.value || "0.02"), 0, 0.2);
    const maxIter = clamp(parseInt(els.maxIter.value || "20",10), 5, 100);

    const km = kmeans(points, k, maxIter);
    const merged = mergeSmallClusters(km, points, minPct);

    const counts = Array(merged.centroids.length).fill(0);
    for(const lab of merged.labels) counts[lab]++;
    const total = merged.labels.length;

    const base = merged.centroids.map((c,i)=>({
      rgb: c, hex: rgbToHex(c), pct: counts[i]/total
    })).filter(c=>c.pct>0).sort((a,b)=>b.pct-a.pct);

    paletteAll = base.map(c=>({ ...c, enabled:true }));
    renderPaletteList();
    renderPreview();
  }catch(err){
    alert((I18N[lang].fail) + (err?.message || err));
    console.error(err);
  }
}

/* Drag & Drop */
["dragenter","dragover"].forEach(evt=>{
  els.drop.addEventListener(evt, e=>{ e.preventDefault(); e.stopPropagation(); els.drop.classList.add("drag"); });
});
["dragleave","drop"].forEach(evt=>{
  els.drop.addEventListener(evt, e=>{ e.preventDefault(); e.stopPropagation(); els.drop.classList.remove("drag"); });
});
els.drop.addEventListener("drop", e=>{
  const file = [...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith("image/"));
  if(file){ document.getElementById("file").files = e.dataTransfer.files; analyzeFromFile(file); }
});

/* File input */
els.file.addEventListener("change", ()=>{
  const f = els.file.files?.[0];
  if(f) analyzeFromFile(f);
});

/* Live updates */
[els.k, els.minPct, els.minPctR, els.maxIter].forEach(el=>{
  el.addEventListener("input", ()=>{
    const f = els.file.files?.[0];
    if(f) analyzeFromFile(f);
  });
});
document.querySelectorAll("input[name='orient']").forEach(r=>r.addEventListener("change", renderPreview));

/* Download PNG */
document.getElementById("download").addEventListener("click", ()=>{
  const a = document.createElement("a");
  a.download = `palette_${els.preview.width}x${els.preview.height}.png`;
  a.href = els.preview.toDataURL("image/png");
  a.click();
});

/* Init：默认中文界面，但占位图默认英文 */
applyLang();
setPlaceholder(); // 默认 placeholder 英文（因 lang 初值传入 setPlaceholder）
renderPreview();
</script>
